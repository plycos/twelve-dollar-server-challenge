quarkus:
  package:
    jar:
      type: uber-jar
  log:
    level: INFO
  http:
    host: ${HOST:0.0.0.0}
    port: ${PORT:80}
    auth:
      proactive: false
  datasource:
    db-kind: other
    jdbc:
      driver: org.sqlite.JDBC
      url: jdbc:sqlite:${SQLITE_PATH:./feed.db}
      max-size: 1
      additional-jdbc-properties:
        journal_mode: WAL
        synchronous: NORMAL
        busy_timeout: 5000
        foreign_keys: on
    devservices:
      enabled: false
