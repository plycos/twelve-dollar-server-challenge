quarkus:
  package:
    jar:
      type: uber-jar
  log:
    level: INFO
  http:
    host: ${HOST:0.0.0.0}
    port: ${PORT:80}
    so-reuse-port: true
    auth:
      proactive: false
  datasource:
    db-kind: other
    jdbc:
      driver: org.sqlite.JDBC
      url: jdbc:sqlite:${SQLITE_PATH:./feed.db}
      min-size: 1
      max-size: 1
      additional-jdbc-properties:
        journal_mode: WAL
        busy_timeout: 5000
        mmap_size: 1073741824
        cache_size: -65536
        temp_store: MEMORY
        synchronous: NORMAL
        foreign_keys: on
    devservices:
      enabled: false

jwt-secret: ${JWT_SECRET:twelve-dollar-challenge}
